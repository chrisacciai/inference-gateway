apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: inference-gateway
  namespace: production
spec:
  replicas: 12
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 50
        - pause:
            duration: 10m
        - setWeight: 100
      analysis:
        templates:
          - templateName: inference-gateway-health
        args:
          - name: service-name
            value: inference-gateway
      abortScaleDownDelaySeconds: 30
  selector:
    matchLabels:
      app: inference-gateway
  template:
    metadata:
      labels:
        app: inference-gateway
    spec:
      containers:
        - name: inference-gateway
          image: cursor/inference-gateway:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
